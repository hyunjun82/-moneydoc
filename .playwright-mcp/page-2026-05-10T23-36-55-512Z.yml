            - generic [ref=e310]: 신DTI란?
            - generic [ref=e311]: 신DTI(총부채상환비율)은 연간 총 소득에서 주택담보대출 원리금(원금+이자)과 기타 대출의 이자가 차지하는 비율을 말합니다. 기존의 DTI는 기존 담보대출의 경우에는 이자만 포함되어 계산되었으나 신DTI의 경우 기존 담보대출의 원리금(원금+이자)까지 더해 산출됩니다.
          - listitem [ref=e312]:
            - generic [ref=e313]: 기타보유대출 연이자
            - generic [ref=e314]: 보유 중인 모든 대출 중 주택담보대출을 제외한 대출의 연이자 합계를 의미합니다.
          - listitem [ref=e315]:
            - generic [ref=e316]: 원리금균등상환
            - generic [ref=e317]: 원리금(원금+이자)을 매 기간 균등하게 갚는 방법입니다.
          - listitem [ref=e318]:
            - generic [ref=e319]: 원금균등상환
            - generic [ref=e320]: 대출금을 약정기간으로 나눠 매달 원금이 균등히 상환되도록 하는 방법입니다.
          - listitem [ref=e321]:
            - generic [ref=e322]: 만기일시상환
            - generic [ref=e323]: 약정기간 중에는 이자만 부담하다가 만기일에 대출 전액을 상환하는 방법입니다.
          - listitem [ref=e324]:
