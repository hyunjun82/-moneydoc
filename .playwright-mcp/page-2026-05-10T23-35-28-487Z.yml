      - generic [ref=e316]:
        - heading "DSR 안내사항" [level=3] [ref=e318]
        - list [ref=e319]:
          - listitem [ref=e320]:
            - generic [ref=e321]: DSR이란?
            - generic [ref=e322]: DSR(총체적상환능력비율)은 연간 총 소득에서 전체 대출금의 원리금(원금+이자)이 차지하는 비율을 말합니다. 주택담보대출뿐 아니라 신용대출과 자동차담보대출 등 모든 대출금이 해당됩니다.
          - listitem [ref=e323]:
            - generic [ref=e324]: 원리금균등상환
            - generic [ref=e325]: 원리금(원금+이자)을 매 기간 균등하게 갚는 방법입니다.
          - listitem [ref=e326]:
            - generic [ref=e327]: 원금균등상환
            - generic [ref=e328]: 대출금을 약정기간으로 나눠 매달 원금이 균등히 상환되도록 하는 방법입니다.
          - listitem [ref=e329]:
            - generic [ref=e330]: 만기일시상환
            - generic [ref=e331]: 약정기간 중에는 이자만 부담하다가 만기일에 대출 전액을 상환하는 방법입니다.
          - listitem [ref=e332]:
            - generic [ref=e333]: DSR 주의사항
            - list [ref=e335]:
              - listitem [ref=e336]: 신용이 좋아지면 금리를 낮출 수 있으며, 향후 대출 시 더 유리한 조건으로 거래할 수 있습니다.
              - listitem [ref=e337]: DSR 계산기는 필수 정보값을 이용하여 추정치를 보여주는 참고용입니다.
              - listitem [ref=e338]: 본인의 신용도와 입력 보유 대출의 상환방법, 상환기간 등 기타 상세한 정보에 따라서 결과값이 오차가 있을 수 있습니다.
              - listitem [ref=e339]: 신용대출 DSR 상환기간 기준은 10년 입니다.
              - listitem [ref=e340]: DSR 70% 부터 高DSR 위험 군으로 취급하고 있으며, 기준은 정부 규제에 따라 변경될 수 있습니다.
              - listitem [ref=e341]: 각 금융기관의 정책과 취급 상품 속성에 따라 승인 및 한도가 달라집니다.