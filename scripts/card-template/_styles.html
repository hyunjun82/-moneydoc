<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 디자인 토큰 (styles.css 내장 — 단독 실행용) ===== */
:root{
  --paper:#f7f5f0; --paper-2:#efebe1; --surface:#fdfbf6; --surface-alt:#f1ede2;
  --ink-900:#134e4a; --ink-700:#3f4651; --ink-500:#6b7280; --ink-300:#9ca3af;
  --line:#e0d9c8; --line-strong:#cfc7b2;
  --blue-700:#0f766e; --blue-600:#115e59; --blue-soft:#ccfbf1;
  --green-700:#b45309; --green-soft:#f6ecd8;
  --sand-700:#b45309; --sand-soft:#f3ead4;
  --bg-page:var(--paper); --bg-card:var(--surface); --bg-inset:var(--surface-alt);
  --text-strong:var(--ink-900); --text-body:var(--ink-700); --text-muted:var(--ink-500); --text-faint:var(--ink-300);
  --border-card:var(--line); --border-hr:var(--line-strong);
  --accent:var(--blue-700); --accent-bg:var(--blue-soft); --accent-on:#FFFFFF;
  --good:var(--green-700); --good-bg:var(--green-soft);
  --tag:var(--sand-700); --tag-bg:var(--sand-soft);
  --font-sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --fs-eyebrow:13px; --fs-caption:14px; --fs-body:17px; --fs-lead:20px;
  --fs-h3:21px; --fs-h2:27px; --fs-h1:36px; --fs-display:46px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extrabold:800;
  --lh-tight:1.25; --lh-snug:1.4; --lh-body:1.7;
  --ls-tight:-0.02em; --ls-normal:-0.01em; --ls-eyebrow:0.06em;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  --measure:720px;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(19,78,74,.04),0 8px 24px rgba(19,78,74,.06);
  --shadow-soft:0 1px 2px rgba(19,78,74,.04),0 2px 8px rgba(19,78,74,.05);
}
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; scroll-padding-top: 16px; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--text-body);
    line-height: var(--lh-body);
    padding: var(--sp-10) var(--sp-5) var(--sp-16);
    background-image: radial-gradient(circle at 18% 6%, rgba(255,255,255,.55), transparent 55%);
  }
  .wrap { max-width: var(--measure); margin: 0 auto; }

  /* ── 글머리 ───────────────────────────────── */
  .masthead { text-align: center; margin-bottom: var(--sp-8); }
  .masthead .kicker {
    font-size: var(--fs-eyebrow); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-eyebrow); color: var(--accent);
  }
  .masthead .src { margin-top: var(--sp-2); font-size: var(--fs-caption); color: var(--text-muted); }

  /* ── 공통 카드 = "소제목 구간" ────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    padding: var(--sp-10);
    margin-bottom: var(--sp-6);
  }
  @media (max-width: 600px) {
    .card { padding: var(--sp-8) var(--sp-6); }
    body { padding: var(--sp-6) var(--sp-3) var(--sp-12); }
  }

  .seclabel { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .seclabel .num {
    flex: none; width: 32px; height: 32px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-on); border-radius: var(--r-pill);
    font-size: 15px; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums;
  }
  .seclabel .txt {
    font-size: var(--fs-eyebrow); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-eyebrow); color: var(--text-muted); white-space: nowrap;
  }
  h2 {
    font-size: var(--fs-h2); font-weight: var(--fw-bold); color: var(--text-strong);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); word-break: keep-all;
    margin-bottom: var(--sp-2);
  }
  .secteaser { font-size: var(--fs-body); color: var(--text-muted); word-break: keep-all; margin-bottom: var(--sp-6); }

  /* ── 히어로 ───────────────────────────────── */
  .hero { text-align: center; padding: var(--sp-12) var(--sp-10); }
  .tag {
    display: inline-block; font-size: var(--fs-eyebrow); font-weight: var(--fw-bold);
    color: var(--tag); background: var(--tag-bg); padding: 5px 12px;
    border-radius: var(--r-pill); white-space: nowrap;
  }
  h1 {
    font-size: var(--fs-h1); font-weight: var(--fw-extrabold); color: var(--text-strong);
    line-height: var(--lh-tight); letter-spacing: var(--ls-tight);
    margin: var(--sp-5) 0 var(--sp-4); text-wrap: balance;
  }
  .hero .lead {
    font-size: var(--fs-lead); color: var(--text-body); line-height: var(--lh-snug);
    max-width: 26em; margin: 0 auto; word-break: keep-all; text-wrap: pretty;
  }
  .topics { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: center; margin-top: var(--sp-6); }
  .topics span {
    font-size: var(--fs-caption); font-weight: var(--fw-semibold); color: var(--accent);
    background: var(--accent-bg); padding: 7px 14px; border-radius: var(--r-pill); white-space: nowrap;
  }

  /* ── 핵심 정보 스트립 ─────────────────────── */
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--border-card); border: 1px solid var(--border-card);
    border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--sp-6); }
  @media (max-width: 520px) { .facts { grid-template-columns: 1fr; } }
  .facts .f { background: var(--bg-card); padding: var(--sp-6); text-align: center; }
  .facts .k { font-size: var(--fs-caption); color: var(--text-muted); font-weight: var(--fw-medium); }
  .facts .v { margin-top: 6px; font-size: var(--fs-h3); font-weight: var(--fw-extrabold);
    color: var(--text-strong); letter-spacing: var(--ls-tight); }
  .facts .v.accent { color: var(--accent); }

  /* ── △ 불릿 리스트 ────────────────────────── */
  ul.qa { list-style: none; display: flex; flex-direction: column; gap: var(--sp-5); }
  ul.qa > li { display: flex; gap: var(--sp-3); }
  ul.qa > li .tri {
    flex: none; width: 22px; height: 22px; margin-top: 3px; display: grid; place-items: center;
    color: var(--accent); font-size: 12px;
  }
  ul.qa > li .body { font-size: var(--fs-body); color: var(--text-body); word-break: keep-all; }
  ul.qa > li .body b { color: var(--text-strong); font-weight: var(--fw-bold); }
  .subnote {
    margin-top: 8px; padding: 10px 14px; background: var(--bg-inset);
    border-radius: var(--r-sm); font-size: var(--fs-caption); color: var(--text-muted);
    word-break: keep-all; line-height: var(--lh-snug);
  }
  .subnote b { color: var(--accent); font-weight: var(--fw-semibold); }

  /* ── 정부기여금 3단 매칭 ──────────────────── */
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); margin-bottom: var(--sp-6); }
  @media (max-width: 600px) { .tiers { grid-template-columns: 1fr; } }
  .tier { border: 1px solid var(--border-card); border-radius: var(--r-md); padding: var(--sp-6); background: var(--bg-card); }
  .tier .name { font-size: var(--fs-caption); font-weight: var(--fw-bold); color: var(--text-muted); }
  .tier .rate { margin: var(--sp-2) 0; font-size: var(--fs-display); font-weight: var(--fw-extrabold);
    line-height: 1; letter-spacing: var(--ls-tight); }
  .tier .rate small { font-size: 16px; font-weight: var(--fw-bold); }
  .tier .desc { font-size: var(--fs-caption); color: var(--text-body); word-break: keep-all; }
  .tier.t0 { background: var(--bg-inset); }
  .tier.t0 .rate { color: var(--text-muted); }
  .tier.t1 { border-color: #D6E3F0; }
  .tier.t1 .rate { color: var(--accent); }
  .tier.t2 { background: var(--good-bg); border-color: #CFE6D9; }
  .tier.t2 .rate { color: var(--good); }

  /* 자격 상세 박스 */
  .crit { border: 1px solid var(--border-card); border-radius: var(--r-md); overflow: hidden; }
  .crit .row { display: grid; grid-template-columns: 120px 1fr; border-top: 1px solid var(--border-card); }
  .crit .row:first-child { border-top: none; }
  .crit .h { background: var(--bg-inset); padding: 14px var(--sp-4); font-size: var(--fs-caption);
    font-weight: var(--fw-bold); color: var(--text-strong); display: flex; align-items: center; }
  .crit .c { padding: 14px var(--sp-4); font-size: var(--fs-caption); color: var(--text-body); word-break: keep-all; }
  .crit .c .pill { display: inline-block; font-weight: var(--fw-bold); padding: 1px 8px; border-radius: var(--r-pill);
    font-size: 12px; margin-right: 6px; }
  .crit .c .pill.b { color: var(--accent); background: var(--accent-bg); }
  .crit .c .pill.g { color: var(--good); background: var(--good-bg); }
  @media (max-width: 520px) { .crit .row { grid-template-columns: 1fr; } .crit .h { border-bottom: 1px solid var(--border-card); } }

  /* ── 채팅 Q&A ─────────────────────────────── */
  .chat { display: flex; flex-direction: column; gap: var(--sp-4); }
  .bubble { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: var(--fs-body);
    word-break: keep-all; line-height: var(--lh-snug); }
  .bubble .who { display: block; font-size: 12px; font-weight: var(--fw-bold); margin-bottom: 6px; letter-spacing: var(--ls-normal); }
  .bubble.q { align-self: flex-start; background: var(--bg-inset); color: var(--text-body);
    border-bottom-left-radius: 5px; }
  .bubble.q .who { color: var(--text-muted); }
  .bubble.a { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.a .who { color: rgba(255,255,255,.8); }
  .bubble.a b { font-weight: var(--fw-bold); }

  /* ── CTA / 연락처 ─────────────────────────── */
  .cta { text-align: center; background: var(--accent); color: #fff; padding: var(--sp-10);
    border-radius: var(--r-lg); margin-bottom: var(--sp-8); }
  .cta h2 { color: #fff; }
  .cta p { color: rgba(255,255,255,.85); font-size: var(--fs-body); margin-top: var(--sp-2); }
  .cta .lines { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-6); align-items: center; }
  .cta .line { font-size: var(--fs-body); font-weight: var(--fw-semibold); white-space: nowrap; }
  .cta .line b { font-weight: var(--fw-extrabold); }
  .cta .pillbtn { display: inline-block; margin-top: var(--sp-6); background: #fff; color: var(--accent);
    font-weight: var(--fw-bold); font-size: var(--fs-body); padding: 12px 28px; border-radius: var(--r-pill);
    text-decoration: none; white-space: nowrap; }

  /* ── 불릿 안 소제목(스캔용) ───────────────── */
  .body .hl { display: block; font-size: var(--fs-body); font-weight: var(--fw-bold);
    color: var(--accent); letter-spacing: var(--ls-normal); margin-bottom: 3px; }

  /* ── 한눈에 요약 ──────────────────────────── */
  .keypts { display: flex; flex-direction: column; gap: var(--sp-5); }
  .keypts .pt { display: flex; gap: var(--sp-4); align-items: flex-start; }
  .keypts .pt .n {
    flex: none; width: 30px; height: 30px; border-radius: var(--r-pill);
    background: var(--accent-bg); color: var(--accent); display: grid; place-items: center;
    font-weight: var(--fw-bold); font-size: 14px; margin-top: 2px; }
  .keypts .pt .t {
    font-size: var(--fs-lead); color: var(--text-strong); word-break: keep-all;
    line-height: var(--lh-snug); font-weight: var(--fw-medium); }
  .keypts .pt .t b { color: var(--accent); font-weight: var(--fw-bold); }

  /* ── 내 유형 찾기 ─────────────────────────── */
  .personas { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  @media (max-width: 600px) { .personas { grid-template-columns: 1fr; } }
  .persona { border: 1px solid var(--border-card); border-radius: var(--r-md);
    padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-2); }
  .persona .role { font-size: var(--fs-h3); font-weight: var(--fw-bold);
    color: var(--text-strong); letter-spacing: var(--ls-tight); }
  .persona .situ { font-size: var(--fs-caption); color: var(--text-muted);
    word-break: keep-all; flex: 1; line-height: var(--lh-snug); }
  .persona .rec { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
    padding-top: var(--sp-3); margin-top: var(--sp-2); border-top: 1px solid var(--border-card); }
  .persona .rec .lab { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
  .badge { font-size: var(--fs-caption); font-weight: var(--fw-bold); padding: 3px 11px;
    border-radius: var(--r-pill); white-space: nowrap; }
  .badge.b { color: var(--accent); background: var(--accent-bg); }
  .badge.g { color: var(--good); background: var(--good-bg); }
  .badge.n { color: var(--text-muted); background: var(--bg-inset); }

  /* ── FAQ 아코디언 ─────────────────────────── */
  .faq { display: flex; flex-direction: column; gap: var(--sp-3); }
  .faq details { border: 1px solid var(--border-card); border-radius: var(--r-md);
    background: var(--bg-card); overflow: hidden; }
  .faq summary { list-style: none; cursor: pointer; padding: var(--sp-5) var(--sp-6);
    font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--text-strong);
    display: flex; gap: var(--sp-3); align-items: flex-start; word-break: keep-all; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary .q { flex: none; color: var(--accent); font-weight: var(--fw-extrabold); }
  .faq summary .plus { margin-left: auto; flex: none; color: var(--text-muted);
    transition: transform .2s ease; font-weight: var(--fw-bold); font-size: 20px; line-height: 1; }
  .faq details[open] summary .plus { transform: rotate(45deg); }
  .faq .ans { padding: 0 var(--sp-6) var(--sp-5) calc(var(--sp-6) + 26px);
    font-size: var(--fs-body); color: var(--text-body); word-break: keep-all; line-height: var(--lh-body); }
  .faq .ans b { color: var(--text-strong); font-weight: var(--fw-bold); }

  /* ── 바이라인(에디터·날짜) ────────────────── */
  .byline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4);
    padding: var(--sp-5) var(--sp-6); margin-bottom: var(--sp-6);
    background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--r-md); }
  .byline .ed { display: flex; align-items: center; gap: var(--sp-2); }
  .byline .ava { flex: none; width: 30px; height: 30px; border-radius: var(--r-pill);
    background: var(--accent-bg); color: var(--accent); display: grid; place-items: center;
    font-size: 13px; font-weight: var(--fw-bold); }
  .byline .who { font-size: var(--fs-caption); font-weight: var(--fw-bold); color: var(--text-strong); white-space: nowrap; }
  .byline .dates { font-size: var(--fs-caption); color: var(--text-muted); display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); margin-left: auto; }
  .byline .dates span { white-space: nowrap; }
  .byline .dates time { color: var(--text-body); font-weight: var(--fw-medium); }
  @media (max-width: 520px) { .byline .dates { margin-left: 0; width: 100%; } }

  /* ── 상품 핵심 스펙 ───────────────────────── */
  .spec { border: 1px solid var(--border-card); border-radius: var(--r-md); overflow: hidden; }
  .spec .r { display: grid; grid-template-columns: 136px 1fr; border-top: 1px solid var(--border-card); }
  .spec .r:first-child { border-top: none; }
  .spec .k { background: var(--bg-inset); padding: 14px var(--sp-4); font-size: var(--fs-caption);
    font-weight: var(--fw-bold); color: var(--text-strong); display: flex; align-items: center; }
  .spec .v { padding: 14px var(--sp-4); font-size: var(--fs-body); color: var(--text-body); word-break: keep-all; }
  .spec .v b { color: var(--accent); font-weight: var(--fw-bold); }
  .spec .v .x { color: var(--text-muted); font-size: var(--fs-caption); }
  @media (max-width: 520px) { .spec .r { grid-template-columns: 1fr; } .spec .k { border-bottom: 1px solid var(--border-card); } }

  /* ── 신청 바로가기 바 ─────────────────────── */
  .applybar { background: var(--accent); color: #fff; border-radius: var(--r-lg);
    padding: var(--sp-6) var(--sp-8); margin-bottom: var(--sp-6); display: flex; align-items: center;
    justify-content: space-between; gap: var(--sp-5); flex-wrap: wrap; box-shadow: var(--shadow-card);
    text-decoration: none; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .applybar:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(31,78,121,.28); }
  .applybar:hover .btn { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .applybar .t { font-size: var(--fs-lead); font-weight: var(--fw-extrabold); letter-spacing: var(--ls-tight); }
  .applybar .t small { display: block; font-size: var(--fs-caption); font-weight: var(--fw-medium);
    color: rgba(255,255,255,.82); margin-top: 5px; letter-spacing: 0; }
  .applybar .btn { flex: none; background: #fff; color: var(--accent); font-weight: var(--fw-extrabold);
    font-size: var(--fs-body); padding: 14px 30px; border-radius: var(--r-pill); text-decoration: none;
    white-space: nowrap; transition: transform .12s ease, box-shadow .12s ease; }
  .applybar .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  @media (max-width: 520px) { .applybar { flex-direction: column; align-items: stretch; text-align: center; } }

  /* ── 비교 테이블 (칩형, 칸 분리) ──────────── */
  .cmp { table-layout: fixed; border-collapse: separate; border-spacing: 10px 7px; }
  .cmp th, .cmp td { border: none; padding: 14px 12px; text-align: center; vertical-align: middle;
    border-radius: var(--r-sm); font-size: var(--fs-caption); white-space: normal; word-break: keep-all; }
  .cmp th:first-child, .cmp td:first-child { width: 22%; }
  .cmp th:nth-child(2), .cmp td:nth-child(2) { width: 39%; }
  /* 라벨 열 = 칩 없이 텍스트만 */
  .cmp thead th:first-child, .cmp td.lab { background: transparent; color: var(--text-strong); font-weight: var(--fw-bold); }
  /* 데이터 칸 = 칩 */
  .cmp tbody td { background: var(--bg-inset); color: var(--text-body); }
  /* 청년미래적금 열 = 파란 칩 */
  .cmp th:nth-child(2) { background: var(--accent-bg); color: var(--accent); font-weight: var(--fw-bold); }
  .cmp tbody td:nth-child(2) { background: var(--accent-bg); }
  .cmp thead th:last-child { color: var(--text-strong); font-weight: var(--fw-bold); }
  .cmp tbody td.hl1 { color: var(--accent); font-weight: var(--fw-bold); }

  /* ── 목차(접이식) ──────────────────── */
  .toc { border: 1px solid var(--border-card); border-radius: var(--r-md);
    background: var(--bg-card); margin-bottom: var(--sp-6); overflow: hidden; box-shadow: var(--shadow-soft); }
  .toc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-4) var(--sp-6); font-weight: var(--fw-bold); color: var(--text-strong); font-size: var(--fs-body); }
  .toc > summary::-webkit-details-marker { display: none; }
  .toc > summary .ic { color: var(--accent); font-weight: var(--fw-extrabold); }
  .toc > summary .tog { margin-left: auto; color: var(--text-muted); font-size: 20px; line-height: 1;
    font-weight: var(--fw-bold); transition: transform .2s ease; }
  .toc[open] > summary .tog { transform: rotate(45deg); }
  .toc-nav { display: flex; flex-direction: column; padding: var(--sp-2) var(--sp-4) var(--sp-3);
    border-top: 1px solid var(--border-card); }
